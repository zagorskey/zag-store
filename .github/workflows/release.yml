name: Legacy release workflow disabled

# The upstream Feather release workflow is disabled and must not publish
# Zag Store builds. Releases are built with `make iphoneos` and published
# manually by the maintainers after review.
on:
  workflow_dispatch:

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy release workflow disabled"
