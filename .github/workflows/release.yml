name: Legacy release workflow disabled

# The upstream Feather release workflow must not publish Zag Store builds.
# Releases are packaged with the local AppTesters signing script and
# published to the separate public zag-store-releases repository.
on:
  workflow_dispatch:

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy release workflow disabled"
