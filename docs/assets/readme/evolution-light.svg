<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-label="From Feather 2.9.0 to Zag Store: Swift source grew from 10,224 lines at the fork to 50,332 lines today. 2,071 commits since the fork, 74 new Swift source files, 46 Feather files reworked, 2,273 lines of Rust pairing core and 40 host test suites.">
<title>From Feather 2.9.0 to Zag Store: Swift source grew from 10,224 lines at the fork to 50,332 lines today. 2,071 commits since the fork, 74 new Swift source files, 46 Feather files reworked, 2,273 lines of Rust pairing core and 40 host test suites.</title>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(40px,-24px)}100%{transform:translate(0,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-48}}
.drift{animation:drift 14s ease-in-out infinite}
.drift2{animation:drift 18s ease-in-out infinite reverse}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
.spin2{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite reverse}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.flow{stroke-dasharray:10 14;animation:flow 2.4s linear infinite}
@media (prefers-reduced-motion:reduce){.drift,.drift2,.spin,.spin2,.pulse,.flow{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fd"/><stop offset="1" stop-color="#eef2f9"/></linearGradient>
<linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891c9"/><stop offset=".5" stop-color="#3a5ce8"/><stop offset="1" stop-color="#b02fd9"/></linearGradient>
<linearGradient id="specText" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891c9"/><stop offset=".5" stop-color="#3a5ce8"/><stop offset="1" stop-color="#b02fd9"/></linearGradient>
