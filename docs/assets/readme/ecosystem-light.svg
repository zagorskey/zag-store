<text x="100" y="452" font-size="30" font-weight="700" fill="#0f1729" text-anchor="start">Zag Store for iOS</text>
<text x="100" y="492.0" font-size="21" font-weight="400" fill="#4a5670" text-anchor="start">Discover, sign, install</text><text x="100" y="520.98" font-size="21" font-weight="400" fill="#4a5670" text-anchor="start">and update on the device</text>
<g filter="url(#lift)"><rect x="600" y="214" width="400" height="200" rx="28" fill="#ffffff" fill-opacity="0.7"/></g><rect x="600" y="214" width="400" height="200" rx="28" fill="url(#sheen)"/><rect x="600.5" y="214.5" width="399" height="199" rx="27.5" fill="none" stroke="#1e305a" stroke-opacity="0.11"/>
