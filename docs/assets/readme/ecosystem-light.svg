<text x="628" y="592" font-size="30" font-weight="700" fill="#0f1729" text-anchor="start">Signing service</text>
<text x="628" y="630.0" font-size="21" font-weight="400" fill="#4a5670" text-anchor="start">Gateway and isolated</text><text x="628" y="658.98" font-size="21" font-weight="400" fill="#4a5670" text-anchor="start">workers; your certificate</text>
<g filter="url(#lift)"><rect x="1128" y="214" width="400" height="200" rx="28" fill="#ffffff" fill-opacity="0.7"/></g><rect x="1128" y="214" width="400" height="200" rx="28" fill="url(#sheen)"/><rect x="1128.5" y="214.5" width="399" height="199" rx="27.5" fill="none" stroke="#1e305a" stroke-opacity="0.11"/>
