<text x="1156" y="630.0" font-size="21" font-weight="400" fill="#4a5670" text-anchor="start">Attribution and first</text><text x="1156" y="658.98" font-size="21" font-weight="400" fill="#4a5670" text-anchor="start">launch, shown in totals</text>
<text x="72" y="742" font-size="19" font-weight="500" fill="#5d6782" text-anchor="start">Server components run on Zag Store's infrastructure and are not part of this repository. Only the iOS app's source is published here.</text>
