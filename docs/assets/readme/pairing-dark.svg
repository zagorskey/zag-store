<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-label="Step two, install apps: pair Zag Store with its own device using a pairing code, with no computer or pairing file on iOS 17 and later. Install over Wi-Fi or mobile data, where an Apple Shortcut turns Mobile Data off for the install. Pairing credentials stay on the device. LocalDevVPN, a signing certificate and a provisioning profile that includes the device are still required.">
<title>Step two, install apps: pair Zag Store with its own device using a pairing code, with no computer or pairing file on iOS 17 and later. Install over Wi-Fi or mobile data, where an Apple Shortcut turns Mobile Data off for the install. Pairing credentials stay on the device. LocalDevVPN, a signing certificate and a provisioning profile that includes the device are still required.</title>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(40px,-24px)}100%{transform:translate(0,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-48}}
.drift{animation:drift 14s ease-in-out infinite}
.drift2{animation:drift 18s ease-in-out infinite reverse}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
.spin2{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite reverse}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.flow{stroke-dasharray:10 14;animation:flow 2.4s linear infinite}
@media (prefers-reduced-motion:reduce){.drift,.drift2,.spin,.spin2,.pulse,.flow{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060c"/><stop offset="1" stop-color="#0d1020"/></linearGradient>
<linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#13d5ed"/><stop offset=".5" stop-color="#4777f8"/><stop offset="1" stop-color="#bc44e5"/></linearGradient>
<linearGradient id="specText" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ff0ff"/><stop offset=".5" stop-color="#8ea3ff"/><stop offset="1" stop-color="#d36cf2"/></linearGradient>
<radialGradient id="atA"><stop offset="0" stop-color="#13d5ed" stop-opacity="0.3"/><stop offset="1" stop-color="#13d5ed" stop-opacity="0"/></radialGradient>
<radialGradient id="atB"><stop offset="0" stop-color="#bc44e5" stop-opacity="0.26"/><stop offset="1" stop-color="#bc44e5" stop-opacity="0"/></radialGradient>
<radialGradient id="atC"><stop offset="0" stop-color="#4777f8" stop-opacity="0.22"/><stop offset="1" stop-color="#4777f8" stop-opacity="0"/></radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="lift" x="-40%" y="-60%" width="180%" height="260%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0a1440" flood-opacity="0.55"/></filter>
<clipPath id="frame"><rect width="1600" height="760" rx="32"/></clipPath>

</defs>
<g clip-path="url(#frame)">
<rect width="1600" height="760" fill="url(#bg)"/>
<g class="drift"><ellipse cx="300" cy="420" rx="420" ry="420" fill="url(#atC)"/></g>
<g class="drift2"><ellipse cx="1450" cy="120" rx="420" ry="240" fill="url(#atA)"/></g>
<g class="drift"><ellipse cx="1300" cy="760" rx="420" ry="220" fill="url(#atB)"/></g>
<text x="72" y="92" font-size="21" font-weight="600" fill="#7f879f" text-anchor="start" letter-spacing="4">STEP TWO  ·  INSTALL APPS</text>
<text x="70" y="156" font-size="54" font-weight="700" fill="#f3f5fb" text-anchor="start" letter-spacing="-1.2">Pair once. Install from the device itself.</text>
<g filter="url(#lift)"><rect x="96" y="200" width="360" height="540" rx="54" fill="#0d1020"/></g>
<rect x="97" y="201" width="358" height="538" rx="53" fill="none" stroke="url(#spec)" stroke-width="2.5"/>
<rect x="216" y="218" width="90" height="24" rx="12" fill="#f3f5fb" fill-opacity=".85"/>
<g><rect x="120" y="276" width="312" height="104" rx="22" fill="#ffffff" fill-opacity="0.09"/></g><rect x="120" y="276" width="312" height="104" rx="22" fill="url(#sheen)"/><rect x="120.5" y="276.5" width="311" height="103" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
<g transform="translate(140 308) scale(1.5833333333333333)" fill="none" stroke="url(#spec)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.6 2.6M15.4 15.4 18 18M18 6l-2.6 2.6M8.6 15.4 6 18"/></g>
<text x="194" y="324" font-size="22" font-weight="700" fill="#f3f5fb" text-anchor="start">Zag Store</text>
<text x="194" y="354" font-size="18" font-weight="500" fill="#a9b0c6" text-anchor="start">Pair · sign · install</text>
<path d="M276.0 386v24" stroke="url(#spec)" stroke-width="2.6" stroke-linecap="round" class="flow"/>
<g><rect x="120" y="416" width="312" height="104" rx="22" fill="#ffffff" fill-opacity="0.09"/></g><rect x="120" y="416" width="312" height="104" rx="22" fill="url(#sheen)"/><rect x="120.5" y="416.5" width="311" height="103" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
<g transform="translate(140 448) scale(1.5833333333333333)" fill="none" stroke="url(#spec)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2"/></g>
<text x="194" y="464" font-size="22" font-weight="700" fill="#f3f5fb" text-anchor="start">LocalDevVPN</text>
<text x="194" y="494" font-size="18" font-weight="500" fill="#a9b0c6" text-anchor="start">On-device loopback</text>
<path d="M276.0 526v24" stroke="url(#spec)" stroke-width="2.6" stroke-linecap="round" class="flow"/>
<g><rect x="120" y="556" width="312" height="104" rx="22" fill="#ffffff" fill-opacity="0.09"/></g><rect x="120" y="556" width="312" height="104" rx="22" fill="url(#sheen)"/><rect x="120.5" y="556.5" width="311" height="103" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
<g transform="translate(140 588) scale(1.5833333333333333)" fill="none" stroke="url(#spec)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></g>
<text x="194" y="604" font-size="22" font-weight="700" fill="#f3f5fb" text-anchor="start">iOS device services</text>
<text x="194" y="634" font-size="18" font-weight="500" fill="#a9b0c6" text-anchor="start">RemotePairing · installd</text>
<text x="276.0" y="714" font-size="18" font-weight="600" fill="#7f879f" text-anchor="middle">Everything stays on one device</text>
<g filter="url(#lift)"><rect x="520" y="206" width="1008" height="120" rx="24" fill="#ffffff" fill-opacity="0.055"/></g><rect x="520" y="206" width="1008" height="120" rx="24" fill="url(#sheen)"/><rect x="520.5" y="206.5" width="1007" height="119" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
<g transform="translate(548 244) scale(1.8333333333333333)" fill="none" stroke="url(#spec)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M15.5 12v2.2"/></g>
<text x="618" y="250" font-size="27" font-weight="700" fill="#f3f5fb" text-anchor="start">Pairs with itself</text>
<text x="618" y="284.0" font-size="21" font-weight="400" fill="#a9b0c6" text-anchor="start">A pairing code shown on this device. No computer and no</text><text x="618" y="312.56" font-size="21" font-weight="400" fill="#a9b0c6" text-anchor="start">pairing file on iOS 17 and later. Unpair at any time.</text>
<g filter="url(#lift)"><rect x="520" y="338" width="1008" height="120" rx="24" fill="#ffffff" fill-opacity="0.055"/></g><rect x="520" y="338" width="1008" height="120" rx="24" fill="url(#sheen)"/><rect x="520.5" y="338.5" width="1007" height="119" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
<g transform="translate(548 376) scale(1.8333333333333333)" fill="none" stroke="url(#spec)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19v-2.5M9 19v-6M14 19V9.5M19 19V5"/></g>
<text x="618" y="382" font-size="27" font-weight="700" fill="#f3f5fb" text-anchor="start">Wi-Fi or mobile data</text>
<text x="618" y="416.0" font-size="21" font-weight="400" fill="#a9b0c6" text-anchor="start">On mobile data, an Apple Shortcut switches Mobile Data off</text><text x="618" y="444.56" font-size="21" font-weight="400" fill="#a9b0c6" text-anchor="start">for the install and back on. You approve it first.</text>
<g filter="url(#lift)"><rect x="520" y="470" width="1008" height="120" rx="24" fill="#ffffff" fill-opacity="0.055"/></g><rect x="520" y="470" width="1008" height="120" rx="24" fill="url(#sheen)"/><rect x="520.5" y="470.5" width="1007" height="119" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
<g transform="translate(548 508) scale(1.8333333333333333)" fill="none" stroke="url(#spec)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.4"/><path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7"/></g>
<text x="618" y="514" font-size="27" font-weight="700" fill="#f3f5fb" text-anchor="start">Credentials stay on the device</text>
<text x="618" y="548.0" font-size="21" font-weight="400" fill="#a9b0c6" text-anchor="start">Pairing credentials are stored locally and reused.</text><text x="618" y="576.56" font-size="21" font-weight="400" fill="#a9b0c6" text-anchor="start">Diagnostics never include pairing records or keys.</text>
<g filter="url(#lift)"><rect x="520" y="602" width="1008" height="120" rx="24" fill="#ffffff" fill-opacity="0.055"/></g><rect x="520" y="602" width="1008" height="120" rx="24" fill="url(#sheen)"/><rect x="520.5" y="602.5" width="1007" height="119" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
<g transform="translate(548 640) scale(1.8333333333333333)" fill="none" stroke="url(#spec)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8 12.3 2.7 2.7 5.3-5.6"/></g>
<text x="618" y="646" font-size="27" font-weight="700" fill="#f3f5fb" text-anchor="start">What is still required</text>
<text x="618" y="680.0" font-size="21" font-weight="400" fill="#a9b0c6" text-anchor="start">LocalDevVPN connected, a signing certificate, and a</text><text x="618" y="708.56" font-size="21" font-weight="400" fill="#a9b0c6" text-anchor="start">provisioning profile that includes this device.</text>
</g>
<rect x=".5" y=".5" width="1599" height="759" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>
