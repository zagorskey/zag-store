[package]
name = "zag-rppairing-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "7bd551c16c6dd2e058740d85a2d9399a51a776e9", features = ["remote_pairing", "tunnel_tcp_stack", "rsd", "tcp", "xpc", "aws-lc"] }
mdns-sd = "0.19"
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time"] }
